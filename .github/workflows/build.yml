name: PlatformIO build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Test radar detector
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isrc src/detector.c tests/test_detector.c -o test_detector
          ./test_detector

      - name: Test radar scan control
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isrc src/scan_control.c tests/test_scan_control.c -o test_scan_control
          ./test_scan_control
